name: PDF build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  clean-pdf-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_DATE_EPOCH: "1795219200"
      FORCE_SOURCE_DATE: "1"
      TZ: UTC
    steps:
      - name: Check out the candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare a clean source-only build
        run: |
          set -euo pipefail
          sha256sum --check --strict SHA256SUMS.txt
          mkdir ci-paper
          cp paper/manuscript.tex paper/references.bib ci-paper/
      - name: Build from source with the pinned TeX distribution
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b
        with:
          docker_image: ghcr.io/xu-cheng/texlive-historic-alpine@sha256:73a48f4fc1d3ee7357c8ea5d274af161541c0981432da33339eed7ac1f8e083d
          root_file: manuscript.tex
          working_directory: ci-paper
          args: -pdf -interaction=nonstopmode -halt-on-error -file-line-error
      - name: Inspect the rebuilt PDF and typesetting log
        run: |
          set -euo pipefail
          test -s ci-paper/manuscript.pdf
          test -s ci-paper/manuscript.log
          if grep -Eq 'There were undefined references|Citation .* undefined|Reference .* undefined|multiply defined|(Overfull|Underfull) .[hv]box|^!' ci-paper/manuscript.log; then
            exit 1
          fi
          python3 -B scripts/check_paper.py ci-paper/manuscript.pdf
      - name: Upload rebuilt PDF and log
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: manuscript-pdf
          path: |
            ci-paper/manuscript.pdf
            ci-paper/manuscript.log
          if-no-files-found: error
          retention-days: 7
