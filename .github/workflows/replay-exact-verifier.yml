name: Exact verifier replay
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out the candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Verify frozen inputs
        run: sha256sum --check --strict SHA256SUMS.txt
      - name: Verify that optimized Python is rejected
        run: |
          set -euo pipefail
          if python3 -O -B verification/run.py --max-order 9 > "$RUNNER_TEMP/optimized.txt" 2>&1; then
            exit 1
          fi
          grep -Fq 'Verification requires Python without -O or -OO.' "$RUNNER_TEMP/optimized.txt"
      - name: Replay the finite proofs and census through order nine
        run: python3 -B verification/run.py --max-order 9
