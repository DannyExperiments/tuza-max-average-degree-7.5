    <line data-edge="bx" x1="158.850" y1="228.448" x2="300.235" y2="195.480" stroke="#a3441d" stroke-width="4.4" stroke-linecap="round" />
    <line data-edge="ax" x1="190.000" y1="50.703" x2="158.850" y2="228.448" stroke="#286760" stroke-width="2.8" stroke-linecap="round" />
