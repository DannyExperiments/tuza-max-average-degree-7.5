<svg xmlns="http://www.w3.org/2000/svg" width="760" height="290" viewBox="0 0 760 290" role="img" aria-labelledby="title description">
  <title id="title">Two high fans on the same five vertices</title>
  <desc id="description">The first fan has rim x–b–c–z and a solid copper edge xb. The second has rim b–c–z–x and a dashed blue edge xz. The four spokes from a, and the rim edges bc and cz, occur in both. The two drawings use the same view.</desc>
