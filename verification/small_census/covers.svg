<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 270" role="img" aria-labelledby="title desc">
  <title id="title">Minimum triangle covers containing the chosen edge ab</title>
  <desc id="desc">The bold edges on the complete four-vertex graph are ab and cd. Those on the complete five-vertex graph are ab, cd, ce and de.</desc>
  <style>
    .edge {stroke:#91a4af;stroke-width:1.8;stroke-linecap:round}
    .bought {stroke:#9b470a;stroke-width:5;stroke-linecap:round}
    .node {fill:#fff;stroke:#344956;stroke-width:1.8}
    text {font:16px -apple-system,Arial,sans-serif;fill:#223943}
    .label {text-anchor:middle;dominant-baseline:central;font-size:15px}
    .heading {font-weight:600;font-size:19px}
  </style>
  <rect width="790" height="270" rx="12" fill="#faf9f5"/>
  <path d="M362 28V249" stroke="#d4d9d8"/>
  <text x="30" y="36" class="heading">K₄</text>
  <text x="78" y="36">Two edges</text>
  <text x="390" y="36" class="heading">K₅</text>
  <text x="438" y="36">Four edges</text>
  <g id="K4">
    <g class="edge">
      <line data-edge="ac" x1="89" y1="89" x2="89" y2="208"/>
      <line data-edge="ad" x1="89" y1="89" x2="265" y2="208"/>
      <line data-edge="bc" x1="265" y1="89" x2="89" y2="208"/>
      <line data-edge="bd" x1="265" y1="89" x2="265" y2="208"/>
    </g>
    <g class="bought">
      <line data-edge="ab" x1="89" y1="89" x2="265" y2="89"/>
      <line data-edge="cd" x1="89" y1="208" x2="265" y2="208"/>
    </g>
    <g class="node">
      <circle data-vertex="a" cx="89" cy="89" r="13"/><circle data-vertex="b" cx="265" cy="89" r="13"/>
      <circle data-vertex="c" cx="89" cy="208" r="13"/><circle data-vertex="d" cx="265" cy="208" r="13"/>
    </g>
    <g class="label">
      <text x="89" y="89">a</text><text x="265" y="89">b</text><text x="89" y="208">c</text><text x="265" y="208">d</text>
    </g>
  </g>
  <g id="K5">
    <g class="edge">
      <line data-edge="ac" x1="451" y1="92" x2="620" y2="75"/>
      <line data-edge="ad" x1="451" y1="92" x2="714" y2="151"/>
      <line data-edge="ae" x1="451" y1="92" x2="610" y2="222"/>
      <line data-edge="bc" x1="451" y1="201" x2="620" y2="75"/>
      <line data-edge="bd" x1="451" y1="201" x2="714" y2="151"/>
      <line data-edge="be" x1="451" y1="201" x2="610" y2="222"/>
    </g>
    <g class="bought">
      <line data-edge="ab" x1="451" y1="92" x2="451" y2="201"/>
      <line data-edge="cd" x1="620" y1="75" x2="714" y2="151"/>
      <line data-edge="ce" x1="620" y1="75" x2="610" y2="222"/>
      <line data-edge="de" x1="714" y1="151" x2="610" y2="222"/>
    </g>
    <g class="node">
      <circle data-vertex="a" cx="451" cy="92" r="13"/><circle data-vertex="b" cx="451" cy="201" r="13"/>
      <circle data-vertex="c" cx="620" cy="75" r="13"/><circle data-vertex="d" cx="714" cy="151" r="13"/>
      <circle data-vertex="e" cx="610" cy="222" r="13"/>
    </g>
    <g class="label">
      <text x="451" y="92">a</text><text x="451" y="201">b</text><text x="620" y="75">c</text>
      <text x="714" y="151">d</text><text x="610" y="222">e</text>
    </g>
  </g>
  <text x="30" y="250" fill="#9b470a">Bold edges form the cover containing ab.</text>
</svg>
